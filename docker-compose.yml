version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: ankiWebParser

    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
 

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_requests"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data: